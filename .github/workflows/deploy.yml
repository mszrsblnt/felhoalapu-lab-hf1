name: Deploy Infrastructure

on:
  push:
    branches:
      - iac-terraform

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      backend_sha: ${{ steps.get_digest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            src:
              - 'CloudGalleryApi/**'

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Check if image exists
        id: check_image
        run: |
          if gcloud artifacts docker images describe europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/felhoalapu-lab-hf1/cloud-lab-be:latest --quiet >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker Auth
        if: steps.filter.outputs.src == 'true' || steps.check_image.outputs.exists == 'false'
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Backend
        if: steps.filter.outputs.src == 'true' || steps.check_image.outputs.exists == 'false'
        run: |
          docker build -t europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/felhoalapu-lab-hf1/cloud-lab-be:latest ./CloudGalleryApi
          docker push europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/felhoalapu-lab-hf1/cloud-lab-be:latest

      - name: Get Digest
        id: get_digest
        if: always()
        run: |
          gcloud auth activate-service-account --key-file=<(echo '${{ secrets.GCP_CREDENTIALS }}')
          DIGEST=$(gcloud artifacts docker images describe \
            europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/felhoalapu-lab-hf1/cloud-lab-be:latest \
            --format='get(image_summary.digest)' --quiet || echo "")
          echo "sha=$DIGEST" >> $GITHUB_OUTPUT

  build-frontend:
    runs-on: ubuntu-latest
    outputs:
      frontend_sha: ${{ steps.get_digest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            src:
              - 'cloud-gallery-fe/**'

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Check if image exists
        id: check_image
        run: |
          if gcloud artifacts docker images describe europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/felhoalapu-lab-hf1/cloud-lab-fe:latest --quiet >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Docker Auth
        if: steps.filter.outputs.src == 'true' || steps.check_image.outputs.exists == 'false'
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Frontend
        if: steps.filter.outputs.src == 'true' || steps.check_image.outputs.exists == 'false'
        run: |
          docker build -t europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/felhoalapu-lab-hf1/cloud-lab-fe:latest ./cloud-gallery-fe
          docker push europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/felhoalapu-lab-hf1/cloud-lab-fe:latest

      - name: Get Digest
        id: get_digest
        if: always()
        run: |
          gcloud auth activate-service-account --key-file=<(echo '${{ secrets.GCP_CREDENTIALS }}')
          DIGEST=$(gcloud artifacts docker images describe \
            europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/felhoalapu-lab-hf1/cloud-lab-fe:latest \
            --format='get(image_summary.digest)' --quiet || echo "")
          echo "sha=$DIGEST" >> $GITHUB_OUTPUT

  terraform-deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
        working-directory: ./terraform
      - run: |
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="backend_digest=${{ needs.build-backend.outputs.backend_sha }}" \
            -var="frontend_digest=${{ needs.build-frontend.outputs.frontend_sha }}"
        working-directory: ./terraform